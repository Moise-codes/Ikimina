name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ikimina
          POSTGRES_PASSWORD: ikimina
          POSTGRES_DB: ikimina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ikimina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://ikimina:ikimina@localhost:5432/ikimina_test
      REDIS_URL: redis://localhost:6379/0
      # Fake, obviously-not-secret values: the suite never uses real secrets.
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-validation-000
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test (pytest with coverage gate)
        run: pytest

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --requirement requirements.txt

      - name: Static security scan (bandit)
        run: bandit --recursive app --quiet

  docker:
    name: Build the API image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --tag ikimina-api:ci ./backend
